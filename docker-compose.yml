services:
  hub:
    build: .
    # Host networking: required so the Wake-on-LAN tool's UDP broadcasts reach the LAN.
    # `ports:` is ignored in this mode — the hub binds the host port from config.json ("port").
    network_mode: host
    env_file:
      - .env
    volumes:
      # Mount your config (read-only). Copy config.example.json → config.json first.
      - ./config.json:/app/config.json:ro
      # Optional: persist npx cache so stdio upstreams don't re-download on every start
      - npx-cache:/home/mcpuser/.npm
      # OAuth2 credentials for all Google services (Gmail, Calendar, Sheets).
      # Run auth once on the host: see README for instructions.
      - ./.google-oauth:/home/mcpuser/.google-oauth:ro
    restart: unless-stopped
    healthcheck:
      # HUB_PORT must match "port" in config.json
      test: ["CMD", "wget", "-qO-", "http://localhost:${HUB_PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  npx-cache:
