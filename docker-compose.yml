services:
  hub:
    build: .
    ports:
      - "${HUB_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      # Mount your config (read-only). Copy config.example.json → config.json first.
      - ./config.json:/app/config.json:ro
      # Optional: persist npx cache so stdio upstreams don't re-download on every start
      - npx-cache:/home/mcpuser/.npm
      # OAuth2 credentials for all Google services (Gmail, Calendar, Sheets).
      # Run auth once on the host: see README for instructions.
      - ./.google-mcp:/home/mcpuser/.google-mcp:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  npx-cache:
